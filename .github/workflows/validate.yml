name: Validate manifest

on:
  push:
  pull_request:
  schedule:
    # The manifest points at live release assets, so check it periodically too:
    # an asset re-uploaded under the same name changes its digest and every client
    # that already verified the old one would start failing.
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifest.json
        run: python3 scripts/validate_manifest.py manifest.json

      - name: Validate manifest.example.json
        run: python3 scripts/validate_manifest.py manifest.example.json

      - name: Manifest must match the published release assets
        run: python3 scripts/build_manifest.py --check

      - name: Every manifest entry must keep the documented naming scheme
        run: |
          python3 - <<'PY'
          import json, re, sys
          manifest = json.load(open("manifest.json", encoding="utf-8"))
          pattern = re.compile(r"^MeetingSTT-model-.+-v\d[\w.\-]*(\.part\d+)?\.zip$")
          problems = []
          for model in manifest["models"]:
              for version in model["versions"]:
                  for asset in version["assets"]:
                      name, url = asset["filename"], asset["url"]
                      if not pattern.match(name):
                          problems.append(f"{name}: filename does not follow MeetingSTT-model-<variant>-<tag>.zip")
                      if not url.endswith(name):
                          problems.append(f"{name}: url does not point at this file")
                      if not url.startswith("https://github.com/Eric-YHS/MeetingSTT-models/releases/download/"):
                          problems.append(f"{name}: asset should be served from this repository's releases")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("ok  naming and download URLs are consistent")
          PY

  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
