name: Validate manifest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest.example.json
        run: python3 scripts/validate_manifest.py manifest.example.json
      - name: Validate manifest.json (when present)
        run: |
          if [ -f manifest.json ]; then
            python3 scripts/validate_manifest.py manifest.json
          else
            echo "manifest.json not published yet - skipping"
          fi
